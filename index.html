
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>expenses tracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <section id="user-input" class="card">
      <div class="control">
        <label for="amount">Expense (amount)</label>
        <input
          type="number"
          id="amount"
          min="0"
          step="0.01"
          autocomplete="off"
        />
      </div>

      <div class="inline-controls">
        <div class="control">
          <label for="category">Category</label>
          <input type="text" id="category" autocomplete="off" />
        </div>

        <div class="control">
          <label for="name">Name</label>
          <input type="text" id="name" autocomplete="off" />
        </div>
      </div>

      <button id="add-expense-btn">Add expense</button>
    </section>

    <section id="filter" class="card">
      <label for="filter-title">Filter by category</label>
      <input type="text" id="filter-category" autocomplete="off" />
      <button id="search-btn">Search</button>
    </section>

    <ul id="expenses-list" class="card"></ul>
  </body>
</html>
